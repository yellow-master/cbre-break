name: Build CBRE Break APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: 28.2.13676358

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl git unzip xz-utils zip
          pip install --no-cache-dir flet==0.86.5 flet-cli==0.86.5

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install required SDK components
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "platform-tools"

      - name: Build APK
        run: |
          export GRADLE_OPTS="-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -Dorg.gradle.daemon=false"
          flet build apk --yes \
            --bundle-id de.cbre.breakapp \
            --product "CBRE Break" \
            --build-version ${GITHUB_REF_NAME#v} \
            --build-number ${{ github.run_number }} \
            --org de.cbre \
            --project CBRE_BREAK .

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cbre-break-apk
          path: build/flutter/android/app/release/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: build/flutter/android/app/release/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
