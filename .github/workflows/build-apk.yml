name: Build CBRE Break APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl git unzip xz-utils zip

      - name: Install Flet
        run: |
          pip install --no-cache-dir flet==0.86.5 flet-cli==0.86.5

      - name: Set up Android SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -sL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          rm cmdline-tools.zip
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "platform-tools"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Show environment and config
        run: |
          flutter config --android-sdk $ANDROID_HOME
          flutter doctor -v || true
          flet --version
          echo "pyproject.toml:"
          cat pyproject.toml

      - name: Build APK
        run: |
          echo "Starting Flet build..."
          flet build apk --no-rich-output --yes \
            --bundle-id de.cbre.breakapp \
            --product "CBRE Break" \
            --build-version ${GITHUB_REF_NAME#v} \
            --build-number ${{ github.run_number }} \
            --org de.cbre \
            --project CBRE_BREAK \
            . 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Flet build exit code: $BUILD_EXIT"
          if [ -d "build/flutter/android" ]; then
            echo "Generated gradle.properties:"
            cat build/flutter/android/gradle.properties || true
          fi
          exit $BUILD_EXIT

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cbre-break-apk
          path: build/flutter/android/app/release/app-release.apk
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && success()
        uses: softprops/action-gh-release@v1
        with:
          files: build/flutter/android/app/release/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
