name: Build CBRE Break APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk
      SERIOUS_PYTHON_SITE_PACKAGES: ${{ github.workspace }}/build/site-packages
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl git unzip xz-utils zip

      - name: Install Flet
        run: |
          pip install --no-cache-dir flet==0.86.5 flet-cli==0.86.5

      - name: Set up Android SDK
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -sL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          rm cmdline-tools.zip
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "platform-tools"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Build APK
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
          SERIOUS_PYTHON_SITE_PACKAGES: ${{ github.workspace }}/build/site-packages
        run: |
          flutter config --android-sdk $ANDROID_HOME
          flet --version
          echo "=== START BUILD ==="
          set +e
          flet build apk --verbose --yes \
            --bundle-id de.cbre.breakapp \
            --product "CBRE Break" \
            --org de.cbre \
            --project CBRE_BREAK \
            --build-version 1.0 \
            --build-number 1 \
            . 2>&1 | tee build.log
          echo "=== EXIT CODE: $? ==="
          set -e
          echo "=== gradle.properties ==="
          cat build/flutter/android/gradle.properties 2>/dev/null || true
          echo "=== BUILD FINISHED ==="

      - name: Inspect build outputs
        run: |
          echo "=== BUILD TREE ==="
          find build -maxdepth 5 -type f 2>/dev/null | head -200 || true
          echo "=== APK SEARCH ==="
          find build -maxdepth 5 -name "*.apk" 2>/dev/null || true
          find . -maxdepth 5 -name "*.apk" 2>/dev/null || true
          echo "=== build/apk ==="
          ls -la build/apk 2>/dev/null || true
          echo "=== build/app/outputs ==="
          find build/app/outputs -maxdepth 3 -type f 2>/dev/null || true
          echo "=== GRADLE PROPERTIES ==="
          cat build/flutter/android/gradle.properties 2>/dev/null || true
          echo "=== BUILD LOG TAIL ==="
          tail -n 80 build.log 2>/dev/null || true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cbre-break-apk
          path: |
            build/apk/*.apk
            build/app/outputs/flutter-apk/*.apk
            build/flutter/android/app/release/app-release.apk
            build/**/*.apk
          retention-days: 30
        continue-on-error: false

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 30

      - name: Fail if no APK found
        if: success()
        run: |
          if ! find build -maxdepth 5 -name "*.apk" 2>/dev/null | grep -q .; then
            echo "ERROR: No APK found in build directory"
            exit 1
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && success()
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/apk/*.apk
            build/app/outputs/flutter-apk/*.apk
            build/flutter/android/app/release/app-release.apk
            build/**/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
