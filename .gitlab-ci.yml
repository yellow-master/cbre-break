stages:
  - build
  - package

variables:
  FLUTTER_VERSION: "3.44.8"
  FLET_VERSION: "0.86.5"
  ANDROID_SDK_ROOT: "/opt/android-sdk"
  GRADLE_OPTS: "-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -Dorg.gradle.daemon=false"

before_script:
  - echo "Setting up build environment..."
  - export PATH="$PATH:/opt/android-sdk/cmdline-tools/latest/bin:/opt/android-sdk/platform-tools"

build_apk:
  stage: build
  image: ubuntu:22.04
  tags:
    - linux
    - amd64
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq curl git unzip xz-utils zip openjdk-17-jdk
    - mkdir -p /opt/android-sdk/cmdline-tools /opt/flutter
    - curl -sL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o cmdline-tools.zip
    - unzip -q cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
    - mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
    - rm cmdline-tools.zip
    - yes | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
    - /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "platform-tools"
    - curl -sL "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" -o flutter.tar.xz
    - tar -xf flutter.tar.xz -C /opt/flutter --strip-components=1
    - rm flutter.tar.xz
    - export PATH="/opt/flutter/bin:$PATH"
    - flutter --version
    - pip install --no-cache-dir "flet==${FLET_VERSION}" "flet-cli==${FLET_VERSION}"
  script:
    - export PATH="/opt/flutter/bin:$PATH"
    - export ANDROID_HOME="/opt/android-sdk"
    - export ANDROID_SDK_ROOT="/opt/android-sdk"
    - flet build apk --yes \
        --bundle-id de.cbre.breakapp \
        --product "CBRE Break" \
        --build-version 1.0 \
        --build-number 1 \
        --org de.cbre \
        --project CBRE_BREAK .
  artifacts:
    paths:
      - build/flutter/android/app/release/app-release.apk
    expire_in: 1 week
  only:
    - tags
    - main
